services:
  bot:
    build: .
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgres://botuser:botpass@db:5432/botdb
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
      - ADMIN_IDS=${ADMIN_IDS}
      - PROXY_ENABLED=${PROXY_ENABLED:-false}
      - PROXY_SOCKS_URL=${PROXY_SOCKS_URL:-}
      - PROXY_HTTP_URL=${PROXY_HTTP_URL:-}
      - PROXY_EXTRA_HOSTS=${PROXY_EXTRA_HOSTS:-}
      - PROXY_DIRECT_HOSTS=${PROXY_DIRECT_HOSTS:-}
      - TELEGRAM_API_BASE=${TELEGRAM_API_BASE:-}
      - TELEGRAM_API_FALLBACKS=${TELEGRAM_API_FALLBACKS:-}
    volumes:
      - ./certs:/app/certs
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certs:/etc/nginx/certs
    depends_on:
      - bot

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=botuser
      - POSTGRES_PASSWORD=botpass
      - POSTGRES_DB=botdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botuser -d botdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
